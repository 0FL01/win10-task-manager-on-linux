[profile.release]
opt-level = 3
codegen-units = 1

[workspace]
resolver = "2"
members = [
    "apps/taskmanager",
    "crates/mc-core",
    "crates/mc-graph",
    "crates/mc-graph-core",
    "crates/mc-magpie",
    "crates/mc-ui",
    "xtask",
]
default-members = [
    "apps/taskmanager",
    "crates/mc-core",
    "crates/mc-graph",
    "crates/mc-graph-core",
    "crates/mc-magpie",
    "crates/mc-ui",
    "xtask",
]
exclude = ["subprojects/magpie"]

[workspace.package]
version = "1.2.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.92"

[workspace.dependencies]
arrayvec = "0.7"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "wayland", "x11"] }
egui = "0.36.2"
egui_extras = { version = "0.36.2", default-features = false, features = ["svg", "image"] }
egui_kittest = { version = "0.36.2", features = ["wgpu", "snapshot", "eframe"] }
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
freedesktop-icons = "0.4"
gettext = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
magpie-types = { path = "subprojects/magpie/types" }
mc-core = { path = "crates/mc-core" }
mc-graph = { path = "crates/mc-graph" }
mc-graph-core = { path = "crates/mc-graph-core" }
mc-magpie = { path = "crates/mc-magpie" }
mc-ui = { path = "crates/mc-ui" }
nng-c = "1.11"
nng-c-sys = { version = "1.11", default-features = false }
rand = "0.10"
rust-ini = "0.21"
serde = { version = "1", features = ["derive"] }
libc = "0.2"
serde_json = "1"
textdistance = "1.1"
toml = "1"
