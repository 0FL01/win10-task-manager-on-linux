syntax = "proto2";

package magpie.about;

import "common.proto";

message About {
  message OsInfo {
    optional string name = 1;
    optional string pretty_name = 2;
    optional string id = 3;
    optional string id_like = 4;
    optional string version_id = 5;
    optional string version = 6;
    optional string version_codename = 7;
    optional string ubuntu_codename = 8;
    optional string home_url = 9;
    optional string documentation_url = 10;
    optional string support_url = 11;
    optional string bug_report_url = 12;
    optional string privacy_policy_url = 13;
    optional string os_type = 14;
    optional string os_architecture = 15;
    optional string kernel_release = 16;
    optional string kernel_version = 17;
    optional bytes logo = 18;

    optional string package_manager = 19;
    optional string package_manager_version = 20;
  }

  message DeviceInfo {
    optional string hostname = 1;
    optional string vendor = 2;
    optional string model = 3;
  }

  message DeInfo {
    optional string desktop_environment = 1;
    optional string version = 2;
    optional string windowing_system = 3;
    optional string session_id = 4;
    optional string session_type = 5;
    optional string virtual_terminal = 6;
  }

  required OsInfo os_info = 1;
  required DeInfo de_info = 2;
  required DeviceInfo device_info = 3;
}

message AboutRequest {

}

message AboutResponse {
  oneof response {
    About about_info = 1;
    AboutResponseError error = 2;
  }
}

message AboutResponseError {}
