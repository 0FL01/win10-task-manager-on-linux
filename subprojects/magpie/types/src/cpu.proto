syntax = "proto2";

package magpie.cpu;

message Cpu {
  optional string name = 1;
  optional uint32 socket_count = 2;
  optional uint64 base_freq_khz = 3;
  optional string virtualization_technology = 4;
  optional bool is_virtual_machine = 5;
  optional uint64 l1_combined_cache_bytes = 6;
  optional uint64 l2_cache_bytes = 7;
  optional uint64 l3_cache_bytes = 8;
  optional uint64 l4_cache_bytes = 9;

  required float total_usage_percent = 10;
  required float kernel_usage_percent = 11;
  repeated float core_usage_percent = 12;
  repeated float core_kernel_usage_percent = 13;
  required uint64 current_frequency_mhz = 14;
  optional float temperature_celsius = 15;
  required uint64 total_process_count = 16;
  required uint64 total_thread_count = 17;
  required uint64 total_handle_count = 18;
  required uint64 uptime_seconds = 19;
  optional string frequency_driver = 20;
  optional string frequency_governor = 21;
  optional string power_preference = 22;
  optional float power_draw_w = 23;
}

message CpuRequest {}

message CpuResponse {
  oneof response {
    Cpu cpu = 1;
    CpuResponseError error = 2;
  }
}

message CpuResponseError {}
