syntax = "proto2";

package magpie.apps;

import "common.proto";

message Icon {
  oneof icon {
    magpie.common.Empty empty = 1;
    string id = 2;
    bytes data = 3;
  }
}

message App {
  required string id = 1;
  required string name = 2;
  required string command = 3;
  repeated uint32 pids = 4;
}

message AppsRequest {}

message AppsResponse {
  message AppList {
    repeated App apps = 1;
  }

  oneof response {
    AppList apps = 1;
    AppsResponseError error = 2;
  }
}

message AppsResponseError {}

message AppsIconRequest {
  repeated string app_ids = 1;
}

message AppsIconResponse {
  message AppsIconResponseValue {
    map<string, Icon> pairs = 1;
  }

  oneof response {
    AppsIconResponseValue values = 1;
    AppsIconResponseError error = 2;
  }
}

message AppsIconResponseError {}
