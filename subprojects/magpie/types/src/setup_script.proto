syntax = "proto2";

package magpie.setup_script;

import "common.proto";

message ScriptName {
  required string file = 1;
  required string elevation_command = 2;
}

message ScriptRequest {
  oneof request {
    magpie.common.Empty get_name = 1;
    magpie.common.Empty run = 2;
    magpie.common.Empty run_revert = 3;
    magpie.common.Empty open = 4;
  }
}

message ScriptResponse {
  oneof response {
    magpie.common.Empty run_success = 1;
    ScriptName name = 2;
    string error = 3;
    magpie.common.Empty none = 4;
  }
}
