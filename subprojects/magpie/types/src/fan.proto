syntax = "proto2";

package magpie.fan;

message Fan {
  optional string fan_label = 1;
  optional string temp_name = 2;
  required uint32 fan_index = 3;
  required uint32 hwmon_index = 4;

  required uint32 rpm = 5;
  optional uint32 temp_amount = 6;
  optional float pwm_percent = 7;
  optional uint32 max_rpm = 8;
}

message FansRequest {}

message FansResponse {
  message FanList {
    repeated Fan fans = 1;
  }

  oneof response {
    FanList fans = 1;
    FansResponseError error = 2;
  }
}

message FansResponseError {}
