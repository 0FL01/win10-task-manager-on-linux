name: taskmanager
base: core24
version: '1.2.0'
summary: Task Manager - processes, performance and services (Mission Center backend)
description: |
  Task Manager shows processes, performance, details and services in a familiar
  tabbed interface, with a compact "Fewer details" view for simple monitoring.
  Monitor per-process CPU, memory, disk and network usage, live graphs for CPU,
  memory, disks, network, GPU, fans and batteries, and manage systemd services.
  The pure-Rust user interface uses egui/eframe and hardware-accelerated rendering.

  Task Manager is based on Mission Center: it uses the Mission Center statistics
  backend (magpie) and code from the Mission Center project by the Mission Center
  Developers (GPL-3.0-or-later).

  Intel GPU monitoring is supported only for Broadwell and later GPUs and does
  not support VRAM, power or temperature monitoring.
grade: stable
confinement: strict

plugs:
  system-desktop-files:
    interface: system-files
    read:
      - /var/lib/snapd/hostfs/usr/share/applications
      - /var/lib/snapd/hostfs/usr/share/icons
      - /var/lib/snapd/hostfs/var/lib/flatpak
      - /var/lib/snapd/hostfs/var/lib/snapd/desktop
      - /sys/fs/cgroup/user.slice

  user-desktop-files:
    interface: personal-files
    read:
      - $HOME/.local/share/applications
      - $HOME/.local/share/flatpak/exports/share

slots:
  mission-center:
    interface: dbus
    bus: session
    name: io.github.taskmanager.TaskManager

apps:
  taskmanager:
    environment:
      MC_MAGPIE_HW_DB: $SNAP/usr/share/missioncenter/hw.db
      MC_LOCALEDIR: $SNAP/usr/share/locale
      XDG_DATA_DIRS: /var/lib/snapd/hostfs/usr/share:/var/lib/snapd/hostfs/var/lib/snapd/desktop:/var/lib/snapd/hostfs/var/lib/flatpak/exports/share:$SNAP_REAL_HOME/.local/share:$SNAP_REAL_HOME/.local/share/flatpak/exports/share:$XDG_DATA_DIRS
    plugs:
      - desktop
      - desktop-legacy
      - hardware-observe
      - network-manager
      - network-observe
      - process-control
      - system-observe
      - udisks2
    extensions: [ gnome ]
    command: usr/bin/taskmanager
    common-id: io.github.taskmanager.TaskManager
    desktop: usr/share/applications/io.github.taskmanager.TaskManager.desktop

parts:
  mission-center:
    plugin: nil
    source: .
    override-prime: |
      cp -r $SNAPCRAFT_PART_SRC/snap/local/usr $SNAPCRAFT_PRIME/
      sed -i 's|^Icon=.*|Icon=${SNAP}/usr/share/icons/hicolor/256x256/apps/io.github.taskmanager.TaskManager.png|' "$SNAPCRAFT_PRIME/usr/share/applications/io.github.taskmanager.TaskManager.desktop"
