name: Native packages

on:
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      release_date: ${{ steps.meta.outputs.release_date }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Compute upstream version
        id: meta
        run: python3 support/ci/release-meta.py compute --run-number "$GITHUB_RUN_NUMBER" --output "$GITHUB_OUTPUT"

  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          persist-credentials: false
      - name: Restore Rust cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup/toolchains/1.96.1-x86_64-unknown-linux-gnu
            ~/.rustup/downloads
          key: cargo-checks-1.96.1-${{ hashFiles('Cargo.lock', 'subprojects/magpie/Cargo.lock') }}
          restore-keys: cargo-checks-1.96.1-
      - name: Install build and offscreen-render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils build-essential cmake gettext libdbus-1-dev libdrm-dev libegl-dev \
            libgbm-dev libgl-dev libudev-dev libvulkan-dev libwayland-dev libx11-dev \
            libxcb1-dev libxcursor-dev libxi-dev libxkbcommon-dev libxkbcommon-x11-dev \
            lld mesa-vulkan-drivers patchelf pkg-config python3-venv
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.96.1 --profile minimal --component clippy --component rustfmt
          rustup default 1.96.1
      - name: Rust formatting
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path subprojects/magpie/Cargo.toml --all --check
      - name: Python CI helpers
        run: |
          python3 -m py_compile support/bundle-gpu-libs.py support/ci/*.py
          python3 -m unittest discover -s support/ci/tests -v
          bash -n support/ci/*.sh
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Workspace tests
        env:
          RUST_TEST_THREADS: '1'
        run: cargo test --locked --workspace -- --test-threads=1
      - name: Magpie backend tests
        run: >-
          cargo test --manifest-path subprojects/magpie/Cargo.toml
          -p magpie-platform-linux -p magpie-types --locked --release
      - name: Keep offscreen renders on failure
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ui-snapshots
          path: target/ui-snapshots/
          if-no-files-found: ignore
          retention-days: 7

  native:
    needs: [metadata]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: fedora44
            image: fedora:44
          - distro: opensuse-tumbleweed
            image: opensuse/tumbleweed:latest
          - distro: arch
            image: archlinux:base
          - distro: debian13
            image: debian:13
          - distro: ubuntu26.04
            image: ubuntu:26.04
    env:
      DISTRO: ${{ matrix.distro }}
      BASE_IMAGE: ${{ matrix.image }}
      VERSION: ${{ needs.metadata.outputs.version }}
      RELEASE_DATE: ${{ needs.metadata.outputs.release_date }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          persist-credentials: false
      - name: Restore target Cargo cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup/toolchains/1.96.1-x86_64-unknown-linux-gnu
            ~/.rustup/downloads
          key: cargo-${{ matrix.distro }}-1.96.1-${{ hashFiles('Cargo.lock', 'subprojects/magpie/Cargo.lock') }}
          restore-keys: cargo-${{ matrix.distro }}-1.96.1-
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.96.1 --profile minimal
          rustup default 1.96.1
      - name: Stamp this run's version
        run: >-
          python3 support/ci/release-meta.py stamp
          --version "$VERSION" --date "$RELEASE_DATE"
      - name: Pull native base image
        id: base
        run: |
          docker pull "$BASE_IMAGE"
          DIGEST="$(docker image inspect "$BASE_IMAGE" --format '{{index .RepoDigests 0}}')"
          if [[ -z $DIGEST ]]; then
            echo "Could not resolve immutable base image reference for $BASE_IMAGE" >&2
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Build native toolchain image
        env:
          BASE_IMAGE_DIGEST: ${{ steps.base.outputs.digest }}
        run: |
          docker build --pull \
            --build-arg "BASE_IMAGE=$BASE_IMAGE_DIGEST" \
            --build-arg "NATIVE_DISTRO=$DISTRO" \
            --build-arg "BUILDER_UID=$(id -u)" \
            --build-arg "BUILDER_GID=$(id -g)" \
            --tag taskmanager-native-builder \
            --file support/ci/Dockerfile .
      - name: Build and verify native package
        env:
          BASE_IMAGE_DIGEST: ${{ steps.base.outputs.digest }}
        run: |
          rm -rf target/ci-stage target/ci-packages target/ci-source-inputs
          mkdir -p target/ci-stage target/ci-packages
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$HOME/.cargo:/home/taskmanager/.cargo" \
            --volume "$HOME/.rustup:/home/taskmanager/.rustup" \
            --env DISTRO --env VERSION \
            --workdir /workspace \
            taskmanager-native-builder \
            bash -c '
              set -euo pipefail
              if [[ "$DISTRO" == fedora44 || "$DISTRO" == opensuse-tumbleweed ]]; then
                source support/ci/prepare-libdrm-notices.sh "$DISTRO"
              fi
              bash support/ci/build-native.sh "$DISTRO" "$VERSION" target/ci-stage target/ci-packages
            '
          shopt -s nullglob
          packages=(target/ci-packages/*.rpm target/ci-packages/*.deb target/ci-packages/*.pkg.tar.zst)
          if [[ ${#packages[@]} -ne 1 ]]; then
            printf 'Expected exactly one native package, found %s\n' "${#packages[@]}" >&2
            exit 1
          fi
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --env DISTRO --env VERSION \
            --workdir /workspace \
            --entrypoint bash "$BASE_IMAGE_DIGEST" -c \
            'bash support/ci/verify-native.sh "$DISTRO" "/workspace/'"${packages[0]}"'" "$VERSION"'
          python3 - "$DISTRO" "$VERSION" "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" \
              "$BASE_IMAGE" "$BASE_IMAGE_DIGEST" \
              "$(git -C subprojects/magpie/platform-linux/crates/app-rummage rev-parse HEAD)" \
              target/ci-packages/build-manifest.json <<'PY'
          import json
          import sys
          distro, version, commit, run, image, digest, app_rummage, path = sys.argv[1:]
          with open(path, "w", encoding="utf-8") as output:
              json.dump({
                  "distro": distro,
                  "version": version,
                  "commit": commit,
                  "run_number": int(run),
                  "base_image": image,
                  "base_image_digest": digest,
                  "rust": "1.96.1",
                  "app_rummage": app_rummage,
              }, output, indent=2, sort_keys=True)
              output.write("\n")
          PY
      - name: Upload verified package and internal build metadata
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-${{ matrix.distro }}
          path: target/ci-packages/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [metadata, checks, native]
    if: github.ref == 'refs/heads/main' && needs.checks.result == 'success' && needs.native.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: taskmanager-native-release
      queue: max
    permissions:
      contents: write
    steps:
      - name: Checkout pinned source tree
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          persist-credentials: false
      - name: Restore CI version in release sources
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_DATE: ${{ needs.metadata.outputs.release_date }}
        run: python3 support/ci/release-meta.py stamp --version "$VERSION" --date "$RELEASE_DATE"
      - name: Download all native artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: target/native-artifacts
      - name: Assemble release assets
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          python3 support/ci/make-source-archive.py \
            --version "$VERSION" --output "target/taskmanager-${VERSION}-source.tar.gz"
          python3 support/ci/collect-release.py \
            --downloads target/native-artifacts \
            --output target/release-assets \
            --source-archive "target/taskmanager-${VERSION}-source.tar.gz"
      - name: Create immutable draft release and publish assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to replace a published/draft release" >&2
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "Git tag $tag already exists; refusing to attach a release to an existing tag" >&2
            exit 1
          fi
          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name' 2>/dev/null || true)"
          make_latest=true
          if [[ -n $latest && $latest =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            if ! python3 - "$VERSION" "${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}" <<'PY'
          import sys
          current = tuple(map(int, sys.argv[1].split(".")))
          latest = tuple(map(int, sys.argv[2].split(".")))
          raise SystemExit(0 if current > latest else 1)
          PY
            then
              make_latest=false
            fi
          elif [[ -n $latest ]]; then
            make_latest=false
          fi
          gh release create "$tag" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Task Manager $VERSION" \
            --notes "Automated native packages for Fedora 44, openSUSE Tumbleweed, Arch Linux, Debian 13 and Ubuntu 26.04 (x86_64). Built from commit $GITHUB_SHA."
          shopt -s nullglob
          assets=(target/release-assets/*)
          if [[ ${#assets[@]} -ne 6 ]]; then
            echo "Expected five native packages and one project source archive" >&2
            exit 1
          fi
          gh release upload "$tag" "${assets[@]}"
          gh release edit "$tag" --draft=false --latest="$make_latest"
